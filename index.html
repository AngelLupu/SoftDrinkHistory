    <style>
        #info-card {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(420px, 90vw);
            padding: 22px 24px 20px;
            background: rgba(255, 255, 255, 0.97);
            color: #111;
            border-radius: 18px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
            font-family: Arial, sans-serif;
            display: none;
            z-index: 1001;
        }
        #info-card.visible {
            display: block;
        }
        #info-card h2 {
            margin: 0 0 10px;
            font-size: 22px;
        }
        #info-card p {
            margin: 0 0 10px;
            line-height: 1.5;
            font-size: 14px;
            white-space: pre-wrap;
        }
        #info-card .close-btn {
            position: absolute;
            top: 12px;
            right: 14px;
            border: none;
            background: transparent;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
            color: #444;
        }
    </style>
    <title>Soft Drink History</title>
